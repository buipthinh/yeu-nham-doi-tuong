spring.application.name=rap-phuong-nam
server.port=8080

#Ket noi SQL Server: sua username/password cho dung may cua ban
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=Cinema;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

#Database da tao san bang database/Cinema.sql, Hibernate khong tu tao/sua bang
spring.jpa.hibernate.ddl-auto=none
#Giu nguyen ten bang/cot camelCase (mac dinh Spring doi sang snake_case)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

#Thymeleaf: tat cache de sua giao dien thay ngay
spring.thymeleaf.cache=false
