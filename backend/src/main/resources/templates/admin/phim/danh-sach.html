<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Quản lý phim')}"></head>
<body>
<div class="layout">
    <aside th:replace="~{admin/fragments :: sidebar(${menu})}"></aside>

    <main class="content">
        <div class="page-head">
            <div>
                <h1>Quản lý phim</h1>
                <p class="muted">Xem danh sách · Tìm kiếm · Thêm · Sửa · Đổi trạng thái</p>
            </div>
            <a class="btn primary" th:href="@{/admin/phim/them}">+ Thêm phim</a>
        </div>

        <div th:replace="~{admin/fragments :: flash}"></div>

        <!-- UC2.5 Tim kiem phim -->
        <form class="filters" method="get" th:action="@{/admin/phim}">
            <input class="input" type="search" name="q" th:value="${q}" placeholder="Tên phim, đạo diễn, diễn viên…" aria-label="Từ khóa">
            <select class="input" name="theLoaiId" aria-label="Thể loại">
                <option value="">Mọi thể loại</option>
                <option th:each="tl : ${dsTheLoai}" th:value="${tl.id}" th:text="${tl.tenTheLoai}"
                        th:selected="${tl.id == theLoaiId}"></option>
            </select>
            <select class="input" name="trangThai" aria-label="Trạng thái">
                <option value="">Mọi trạng thái</option>
                <option th:each="tt : ${dsTrangThai}" th:value="${tt}" th:text="${tt.nhan}"
                        th:selected="${tt == trangThai}"></option>
            </select>
            <select class="input" name="doTuoi" aria-label="Độ tuổi">
                <option value="">Mọi độ tuổi</option>
                <option th:each="dt : ${dsDoTuoi}" th:value="${dt}" th:text="${dt.nhan}" th:selected="${dt == doTuoi}"></option>
            </select>
            <select class="input" name="sapXep" aria-label="Sắp xếp">
                <option value="moiNhat" th:selected="${sapXep == 'moiNhat'}">Mới thêm nhất</option>
                <option value="ten" th:selected="${sapXep == 'ten'}">Tên A → Z</option>
                <option value="ngayKhoiChieu" th:selected="${sapXep == 'ngayKhoiChieu'}">Ngày khởi chiếu mới nhất</option>
            </select>
            <button class="btn" type="submit">Tìm</button>
            <a class="btn ghost" th:href="@{/admin/phim}">Xóa lọc</a>
        </form>

        <p class="muted small" th:text="'Tìm thấy ' + ${ketQua.totalElements} + ' phim'"></p>

        <div class="card table-wrap" th:if="${!ketQua.empty}">
            <table class="table">
                <thead>
                <tr>
                    <th>Mã</th><th></th><th>Tên phim</th><th>Thể loại</th><th class="r">Thời lượng</th>
                    <th>Thời gian chiếu</th><th>Tuổi</th><th>Trạng thái</th><th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${ketQua.content}">
                    <td class="mono" th:text="${p.maPhim}">P0001</td>
                    <td><img class="thumb" th:if="${p.poster}" th:src="${p.poster}" alt="" onerror="this.style.visibility='hidden'"></td>
                    <td><a class="link" th:href="@{/admin/phim/{id}(id=${p.id})}" th:text="${p.tenPhim}">Tên phim</a>
                        <div class="muted small" th:text="${p.daoDien}"></div></td>
                    <td class="small" th:text="${p.tenCacTheLoai}"></td>
                    <td class="r" th:text="${p.thoiLuong} + ' phút'"></td>
                    <td class="nowrap"
                        th:text="${#temporals.format(p.ngayKhoiChieu, 'dd/MM/yyyy')} + ' – ' + ${#temporals.format(p.ngayKetThuc, 'dd/MM/yyyy')}"></td>
                    <td><span class="age" th:classappend="'age-' + ${p.doTuoi}" th:text="${p.doTuoi}"></span></td>
                    <td><span class="pill" th:classappend="${p.trangThai.css}" th:text="${p.trangThai.nhan}"></span></td>
                    <td class="actions">
                        <a class="btn sm" th:href="@{/admin/phim/{id}/sua(id=${p.id})}">Sửa</a>
                        <a class="btn sm ghost" th:href="@{/admin/phim/{id}(id=${p.id})}">Chi tiết</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="empty" th:if="${ketQua.empty and tongPhim == 0}">Chưa có phim nào.
            <p><a class="btn primary" th:href="@{/admin/phim/them}">+ Thêm phim</a></p></div>
        <div class="empty" th:if="${ketQua.empty and tongPhim != 0}">Không tìm thấy phim phù hợp.</div>

        <!-- Phan trang -->
        <nav class="pager" th:if="${ketQua.totalPages > 1}">
            <a th:each="i : ${#numbers.sequence(0, ketQua.totalPages - 1)}"
               th:href="@{/admin/phim(q=${q}, theLoaiId=${theLoaiId}, trangThai=${trangThai}, doTuoi=${doTuoi}, sapXep=${sapXep}, trang=${i})}"
               th:text="${i + 1}" th:classappend="${i == ketQua.number} ? 'on'"></a>
        </nav>
    </main>
</div>
</body>
</html>
