<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Đăng nhập')}"></head>
<body>
<style>
    .dn-bg { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; background: #1d1b19; }
    .dn-wrap { width: min(400px, 100%); display: flex; flex-direction: column; align-items: center; }
    .dn-brand { display: flex; flex-direction: column; gap: 8px; align-items: center; text-align: center; color: #f1eee9; margin-bottom: 18px; }
    .dn-brand small { display: block; color: #a39d95; font-size: 12px; }
    .dn-brand .logo { width: 64px; height: 64px; }
    .dn-box { width: 100%; box-sizing: border-box; margin: 0; display: grid; gap: 14px; padding: 26px 24px; }
    .dn-box h1 { margin: 0; font-size: 22px; text-align: center; }
    .dn-box label { font-weight: 600; display: grid; gap: 6px; }
    .dn-box .alert { margin: 0; text-align: center; }
    .dn-box button { justify-content: center; width: 100%; }
    .dn-note { margin: 0; font-size: 13px; text-align: center; }
</style>
<div class="dn-bg">
    <div class="dn-wrap">
        <div class="dn-brand">
            <img class="logo" th:src="@{/logo.jpg}" alt="Logo Rạp Phương Nam">
            <span><b>Rạp Phương Nam</b><small>Trang quản lý</small></span>
        </div>
        <form class="card dn-box" method="post" th:action="@{/admin/dang-nhap}">
            <h1>Đăng nhập</h1>
            <div class="alert ok" th:if="${param.daDangXuat != null}">Bạn đã đăng xuất.</div>
            <div class="alert bad" th:if="${loiDangNhap}" th:text="${loiDangNhap}"></div>
            <input type="hidden" name="tiep" th:value="${tiep}">
            <label>Mã nhân viên hoặc email
                <input class="input" name="tenDangNhap" th:value="${tenDangNhap}" autocomplete="username" autofocus required placeholder="Ví dụ: NV001">
            </label>
            <label>Mật khẩu
                <input class="input" type="password" name="matKhau" autocomplete="current-password" required>
            </label>
            <button class="btn primary" type="submit">Đăng nhập</button>
            <p class="muted dn-note">Tài khoản mẫu: NV001 / admin123 (quản trị), NV003 / nhanvien1 (nhân viên).
                Khách hàng đăng nhập ở trang khách.</p>
        </form>
    </div>
</div>
</body>
</html>
