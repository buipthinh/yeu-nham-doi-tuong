<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Phan <head> dung chung: th:replace="~{admin/fragments :: head('Tieu de')}" -->
<head th:fragment="head(tieuDe)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${tieuDe} + ' · Quản lý Rạp Phương Nam'">Quản lý</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/admin/admin.css}">
</head>

<!-- Thanh ben trai: menu = ma muc dang mo -->
<aside th:fragment="sidebar(menu)" class="sidebar">
    <a class="brand" th:href="@{/admin}">
        <img class="logo" th:src="@{/logo.jpg}" alt="Logo Rạp Phương Nam">
        <span><b>Rạp Phương Nam</b><small>Trang quản lý</small></span>
    </a>
    <!-- Nhan vien chi thay muc Tra cuu ve (UC6.2.2) -->
    <nav th:if="${dangNhap != null and !dangNhap.admin}">
        <div class="grp">Đặt vé</div>
        <a th:href="@{/admin/don-hang/tra-cuu}" class="on">Tra cứu vé <small></small></a>
    </nav>
    <nav th:unless="${dangNhap != null and !dangNhap.admin}">
        <a th:href="@{/admin/tong-quan}" th:classappend="${menu == 'tong-quan'} ? 'on'">Tổng quan <small></small></a>
        <div class="grp">Nội dung</div>
        <a th:href="@{/admin/phim}" th:classappend="${menu == 'phim'} ? 'on'">Phim <small></small></a>
        <a th:href="@{/admin/suat-chieu}" th:classappend="${menu == 'suatChieu'} ? 'on'">Suất chiếu <small></small></a>
        <a th:href="@{/admin/phong}" th:classappend="${menu == 'phong'} ? 'on'">Phòng &amp; sơ đồ ghế <small></small></a>
        <div class="grp">Giá &amp; dịch vụ</div>
        <a th:href="@{/admin/gia-ve}" th:classappend="${menu == 'gia-ve'} ? 'on'">Giá vé <small></small></a>
        <a th:href="@{/admin/thuc-pham}" th:classappend="${menu == 'thuc-pham'} ? 'on'">Thực phẩm <small></small></a>
        <a th:href="@{/admin/don-hang}" th:classappend="${menu == 'don-hang'} ? 'on'">Đơn hàng <small></small></a>
        <div class="grp">Hệ thống</div>
        <a th:href="@{/admin/tai-khoan}" th:classappend="${menu == 'tai-khoan'} ? 'on'">Tài khoản <small></small></a>
        <a th:href="@{/admin/bao-cao}" th:classappend="${menu == 'bao-cao'} ? 'on'">Báo cáo <small></small></a>
        <a th:href="@{/admin/cai-dat}" th:classappend="${menu == 'cai-dat'} ? 'on'">Cài đặt <small></small></a>
    </nav>
    <!-- Nguoi dang dang nhap + dang xuat -->
    <form th:if="${dangNhap != null}" method="post" th:action="@{/admin/dang-xuat}"
          style="margin:20px 6px 0;padding-top:14px;border-top:1px solid #3a3631;display:grid;gap:8px">
        <span><b th:text="${dangNhap.hoTen}">Họ tên</b>
            <small style="display:block;color:#a39d95;font-size:12px" th:text="${dangNhap.ma + ' · ' + dangNhap.tenVaiTro}">NV001 · Quản trị viên</small></span>
        <button class="btn sm" type="submit" style="justify-content:center">Đăng xuất</button>
    </form>
</aside>

<!-- Thong bao sau khi luu / loi nghiep vu (flash attribute) -->
<div th:fragment="flash">
    <div class="alert ok" th:if="${thongBao}" th:text="${thongBao}"></div>
    <div class="alert bad" th:if="${loi}" th:text="${loi}"></div>
</div>

<!-- Tab con cua muc Gia ve (UC5): tab = quy-tac | loai-ve | lich-su -->
<nav th:fragment="tabsGiaVe(tab)" class="tabs">
    <a th:href="@{/admin/gia-ve}" th:classappend="${tab == 'quy-tac'} ? 'on'">Quy tắc giá</a>
    <a th:href="@{/admin/loai-ve}" th:classappend="${tab == 'loai-ve'} ? 'on'">Loại vé &amp; đối tượng</a>
    <a th:href="@{/admin/gia-ve/lich-su}" th:classappend="${tab == 'lich-su'} ? 'on'">Lịch sử giá</a>
</nav>

<!-- Tab con cua muc Don hang (UC6.2): tab = danh-sach | tra-cuu -->
<nav th:fragment="tabsDonHang(tab)" class="tabs">
    <a th:href="@{/admin/don-hang}" th:classappend="${tab == 'danh-sach'} ? 'on'">Danh sách đơn hàng</a>
    <a th:href="@{/admin/don-hang/tra-cuu}" th:classappend="${tab == 'tra-cuu'} ? 'on'">Tra cứu vé</a>
</nav>

</body>
</html>
